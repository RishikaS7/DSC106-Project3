<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter's Retreat - D3 Visualizations</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 30px;
            background-color: #f7f8fa;
            color: #333;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .chart-box {
            background: #fff;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        h3 {
            margin-top: 0;
            font-size: 16px;
            color: #1a202c;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 6px 12px;
            margin-right: 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        button.active {
            background: #2b6cb0;
            color: #fff;
            border-color: #2b6cb0;
        }

        .line {
            fill: none;
            stroke-width: 2.5px;
        }

        .axis text {
            font-size: 11px;
            fill: #4a5568;
        }

        .axis path,
        .axis line {
            stroke: #cbd5e0;
        }

        .tooltip {
            position: fixed;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
            z-index: 100;
        }

        .focus-circle {
            fill: #fff;
            stroke-width: 2.5px;
        }

        #error-log {
            color: red;
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Winter’s Retreat: Seasonality Shift (40°N–70°N)</h1>
    <p class="subtitle">DSC 106 Project 3 Interactive Visualization</p>

    <div id="error-log"></div>

    <div class="chart-box">
        <h3>Chart 1: Mid-Latitude Winter Mean Temperature Projections (1850–2100)</h3>
        <div class="controls">
            <button class="filter-btn active" data-scenario="all">Show All Scenarios</button>
            <button class="filter-btn" data-scenario="ssp126">SSP1-2.6 (Mitigation)</button>
            <button class="filter-btn" data-scenario="ssp585">SSP5-8.5 (High Emissions)</button>
            <button id="annualToggleBtn">Show Every Winter (Annual Detail)</button>
            <button id="zoomBtn">Zoom to Projections (2015–2100)</button>
        </div>
        <div id="chart1"></div>
        <div id="tooltip1" class="tooltip"></div>
    </div>

    <script>
        d3.csv("cmip6_winter_compression.csv").then(rawData => {
            rawData.forEach(d => {
                d.year = +d.year;
                d.winter_mean_temp_c = +d.winter_mean_temp_c;
            });

            rawData.sort((a, b) => a.year - b.year);

            const colorScale = d3.scaleOrdinal()
                .domain(["historical", "ssp126", "ssp585"])
                .range(["#4a5568", "#2b6cb0", "#c53030"]);

            const margin1 = { top: 20, right: 30, bottom: 40, left: 60 };
            const width1 = 800 - margin1.left - margin1.right;
            const height1 = 380 - margin1.top - margin1.bottom;

            const svg1 = d3.select("#chart1")
                .append("svg")
                .attr("width", width1 + margin1.left + margin1.right)
                .attr("height", height1 + margin1.top + margin1.bottom)
                .append("g")
                .attr("transform", `translate(${margin1.left},${margin1.top})`);

            svg1.append("clipPath")
                .attr("id", "clip1")
                .append("rect")
                .attr("width", width1)
                .attr("height", height1);

            const tooltip1 = d3.select("#tooltip1");

            const fullDomain = d3.extent(rawData, d => d.year);
            const zoomDomain = [2015, 2100];

            const x1 = d3.scaleLinear()
                .domain(fullDomain)
                .range([0, width1]);

            const y1 = d3.scaleLinear()
                .domain([
                    d3.min(rawData, d => d.winter_mean_temp_c) - 1,
                    d3.max(rawData, d => d.winter_mean_temp_c) + 1
                ])
                .range([height1, 0]);

            const xAxisGroup = svg1.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(0, ${height1})`)
                .call(d3.axisBottom(x1).tickFormat(d3.format("d")));

            svg1.append("g")
                .attr("class", "axis")
                .call(d3.axisLeft(y1));

            const plot1 = svg1.append("g").attr("clip-path", "url(#clip1)");

            const thresholdLine = plot1.append("line")
                .attr("x1", 0).attr("x2", width1)
                .attr("y1", y1(0)).attr("y2", y1(0))
                .attr("stroke", "#e53e3e")
                .attr("stroke-dasharray", "4 4")
                .attr("stroke-width", 1.5);

            const nestedData = d3.groups(rawData, d => d.scenario);
            const lineGen1 = d3.line()
                .x(d => x1(d.year))
                .y(d => y1(d.winter_mean_temp_c))
                .curve(d3.curveMonotoneX);

            const lineGroups1 = plot1.selectAll(".line-group")
                .data(nestedData)
                .enter()
                .append("g")
                .attr("class", d => `line-group scenario-${d[0]}`);

            lineGroups1.append("path")
                .attr("class", "line")
                .attr("d", d => lineGen1(d[1]))
                .attr("stroke", d => colorScale(d[0]));

            const thawedPoints = rawData.filter(d => d.winter_mean_temp_c >= 0);
            const thawDots = plot1.selectAll(".thaw-dot")
                .data(thawedPoints)
                .enter()
                .append("circle")
                .attr("class", d => `thaw-dot scenario-${d.scenario}`)
                .attr("r", 4)
                .attr("fill", d => colorScale(d.scenario))
                .attr("stroke", "#fff")
                .attr("stroke-width", 1)
                .attr("cx", d => x1(d.year))
                .attr("cy", d => y1(d.winter_mean_temp_c))
                .style("opacity", 0);

            const focusCircle1 = plot1.append("circle")
                .attr("r", 5)
                .attr("class", "focus-circle")
                .style("opacity", 0);

            plot1.append("rect")
                .attr("width", width1)
                .attr("height", height1)
                .style("fill", "none")
                .style("pointer-events", "all")
                .on("mousemove", function (event) {
                    const [mouseX] = d3.pointer(event);
                    const hoveredYear = Math.round(x1.invert(mouseX));
                    const match = rawData.reduce((prev, curr) =>
                        Math.abs(curr.year - hoveredYear) < Math.abs(prev.year - hoveredYear) ? curr : prev
                    );

                    if (match) {
                        focusCircle1
                            .attr("cx", x1(match.year))
                            .attr("cy", y1(match.winter_mean_temp_c))
                            .attr("stroke", colorScale(match.scenario))
                            .style("opacity", 1);

                        tooltip1
                            .style("opacity", 1)
                            .style("left", `${event.clientX + 15}px`)
                            .style("top", `${event.clientY - 28}px`)
                            .html(`<strong>Year:</strong> ${match.year}<br/><strong>Scenario:</strong> ${match.scenario.toUpperCase()}<br/><strong>Temp:</strong> ${match.winter_mean_temp_c.toFixed(2)}°C`);
                    }
                })
                .on("mouseout", function () {
                    focusCircle1.style("opacity", 0);
                    tooltip1.style("opacity", 0);
                });

            d3.selectAll(".filter-btn").on("click", function () {
                const selected = d3.select(this).attr("data-scenario");
                d3.selectAll(".filter-btn").classed("active", false);
                d3.select(this).classed("active", true);

                if (selected === "all") {
                    plot1.selectAll(".line-group").transition().duration(300).style("opacity", 1);
                } else {
                    plot1.selectAll(".line-group").transition().duration(300).style("opacity", 0.15);
                    plot1.selectAll(`.scenario-${selected}`).transition().duration(300).style("opacity", 1);
                    plot1.selectAll(".scenario-historical").transition().duration(300).style("opacity", 1);
                }
            });

            let showAnnualDots = false;
            d3.select("#annualToggleBtn").on("click", function () {
                showAnnualDots = !showAnnualDots;
                d3.select(this).classed("active", showAnnualDots);
                thawDots.transition().duration(250).style("opacity", showAnnualDots ? 1 : 0);
            });

            let isZoomed = false;
            d3.select("#zoomBtn").on("click", function () {
                isZoomed = !isZoomed;
                x1.domain(isZoomed ? zoomDomain : fullDomain);

                d3.select(this)
                    .classed("active", isZoomed)
                    .text(isZoomed ? "Show All Years (1850–2100)" : "Zoom to Projections (2015–2100)");

                xAxisGroup.transition().duration(750)
                    .call(d3.axisBottom(x1).tickFormat(d3.format("d")));

                lineGroups1.selectAll(".line")
                    .transition().duration(750)
                    .attr("d", d => lineGen1(d[1]));

                thawDots.transition().duration(750)
                    .attr("cx", d => x1(d.year));
            });

        }).catch(err => {
            console.error(err);
            d3.select("#error-log").text("Chart 1 Error: " + err.message);
        });
    </script>
</body>

</html>
